<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura do Chapéu Seletor Serverless</title>
  <desc id="desc">Fluxo HTTP orquestrado por Step Functions com Bedrock, DynamoDB e SES; evento de domínio via SNS e SQS; observabilidade no CloudWatch e deploy pelo GitHub Actions.</desc>
  <defs>
    <style>
      .title{font:700 24px Inter,Arial,sans-serif;fill:#172033}.subtitle{font:400 13px Inter,Arial,sans-serif;fill:#5b6577}
      .lane{font:700 12px Inter,Arial,sans-serif;letter-spacing:1.2px;fill:#6d7484}.h{font:700 14px Inter,Arial,sans-serif;fill:#172033}.p{font:400 11px Inter,Arial,sans-serif;fill:#526071}
      .box{stroke-width:2}.line{fill:none;stroke:#667085;stroke-width:2}.dash{stroke-dasharray:6 5}.label{font:600 10px Inter,Arial,sans-serif;fill:#475467}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3 0 6Z" fill="#667085"/></marker>
    <marker id="red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3 0 6Z" fill="#d92d20"/></marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#101828" flood-opacity=".10"/></filter>
  </defs>

  <rect width="1200" height="690" fill="#f8fafc"/>
  <text x="42" y="42" class="title">Chapéu Seletor Serverless — arquitetura final</text>
  <text x="42" y="66" class="subtitle">Orquestração no caminho crítico · coreografia após o sucesso · IA com fallback · infraestrutura como código</text>

  <rect x="32" y="92" width="1136" height="314" rx="18" fill="#fff" stroke="#e3e8ef"/>
  <text x="52" y="119" class="lane">CAMINHO CRÍTICO — STEP FUNCTIONS EXPRESS</text>

  <g filter="url(#shadow)">
    <rect class="box" x="52" y="174" width="120" height="76" rx="12" fill="#f2f4f7" stroke="#98a2b3"/>
    <rect class="box" x="208" y="164" width="150" height="96" rx="12" fill="#fff4e8" stroke="#f79009"/>
    <rect class="box" x="400" y="138" width="175" height="106" rx="12" fill="#f4f0ff" stroke="#7f56d9"/>
    <rect class="box" x="622" y="138" width="160" height="106" rx="12" fill="#eef4ff" stroke="#2970ff"/>
    <rect class="box" x="826" y="138" width="145" height="106" rx="12" fill="#fff1f3" stroke="#e31b54"/>
    <rect class="box" x="1010" y="138" width="130" height="106" rx="12" fill="#ecfdf3" stroke="#039855"/>
  </g>

  <text x="112" y="204" text-anchor="middle" class="h">Cliente</text><text x="112" y="224" text-anchor="middle" class="p">HTTP / JSON</text>
  <text x="283" y="195" text-anchor="middle" class="h">Lambda</text><text x="283" y="215" text-anchor="middle" class="p">valida e roteia</text><text x="283" y="233" text-anchor="middle" class="p">3 endpoints</text>
  <text x="487" y="170" text-anchor="middle" class="h">Amazon Bedrock</text><text x="487" y="191" text-anchor="middle" class="p">Nova Lite escolhe</text><text x="487" y="209" text-anchor="middle" class="p">casa + justificativa</text>
  <text x="702" y="170" text-anchor="middle" class="h">DynamoDB</text><text x="702" y="191" text-anchor="middle" class="p">e-mail como chave</text><text x="702" y="209" text-anchor="middle" class="p">escrita condicional</text>
  <text x="898" y="170" text-anchor="middle" class="h">Amazon SES</text><text x="898" y="191" text-anchor="middle" class="p">notificação</text><text x="898" y="209" text-anchor="middle" class="p">por e-mail</text>
  <text x="1075" y="170" text-anchor="middle" class="h">Sucesso</text><text x="1075" y="191" text-anchor="middle" class="p">persistido e</text><text x="1075" y="209" text-anchor="middle" class="p">notificado</text>

  <path class="line" d="M172 212H204" marker-end="url(#arrow)"/><path class="line" d="M358 212H396" marker-end="url(#arrow)"/>
  <path class="line" d="M575 191H618" marker-end="url(#arrow)"/><path class="line" d="M782 191H822" marker-end="url(#arrow)"/><path class="line" d="M971 191H1006" marker-end="url(#arrow)"/>
  <text x="375" y="198" class="label">sync</text>

  <rect class="box" x="418" y="292" width="140" height="64" rx="11" fill="#fffaeb" stroke="#fdb022"/>
  <text x="488" y="317" text-anchor="middle" class="h">Fallback</text><text x="488" y="337" text-anchor="middle" class="p">MathRandom (4 casas)</text>
  <path class="line dash" d="M487 244V288" marker-end="url(#arrow)"/><text x="497" y="272" class="label">erro/formato</text>
  <path class="line dash" d="M558 324H590Q610 324 610 304V220Q610 191 618 191" marker-end="url(#arrow)"/>

  <rect class="box" x="806" y="292" width="150" height="64" rx="11" fill="#fff1f3" stroke="#d92d20"/>
  <text x="881" y="317" text-anchor="middle" class="h">Compensação</text><text x="881" y="337" text-anchor="middle" class="p">rollback no DynamoDB</text>
  <rect class="box" x="1000" y="292" width="140" height="64" rx="11" fill="#fff1f3" stroke="#d92d20"/>
  <text x="1070" y="317" text-anchor="middle" class="h">SQS DLQ</text><text x="1070" y="337" text-anchor="middle" class="p">reconciliação</text>
  <path d="M898 244V288" fill="none" stroke="#d92d20" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#red)"/><text x="907" y="273" class="label">falha</text>
  <path d="M956 324H996" fill="none" stroke="#d92d20" stroke-width="2" marker-end="url(#red)"/>

  <rect x="32" y="430" width="720" height="210" rx="18" fill="#fff" stroke="#e3e8ef"/>
  <text x="52" y="458" class="lane">COREOGRAFIA — EVENTO DE DOMÍNIO</text>
  <g filter="url(#shadow)">
    <rect class="box" x="72" y="500" width="180" height="82" rx="12" fill="#ecfdf3" stroke="#039855"/>
    <rect class="box" x="304" y="500" width="180" height="82" rx="12" fill="#fdf2fa" stroke="#c11574"/>
    <rect class="box" x="536" y="500" width="170" height="82" rx="12" fill="#eef4ff" stroke="#2970ff"/>
  </g>
  <text x="162" y="530" text-anchor="middle" class="h">AlunoSelecionado</text><text x="162" y="551" text-anchor="middle" class="p">evento v1</text>
  <text x="394" y="530" text-anchor="middle" class="h">Amazon SNS</text><text x="394" y="551" text-anchor="middle" class="p">fan-out desacoplado</text>
  <text x="621" y="530" text-anchor="middle" class="h">SQS Auditoria</text><text x="621" y="551" text-anchor="middle" class="p">consumidor assíncrono</text>
  <path class="line" d="M252 541H300" marker-end="url(#arrow)"/><path class="line" d="M484 541H532" marker-end="url(#arrow)"/>
  <path class="line dash" d="M1140 212H1154V414H162V496" marker-end="url(#arrow)"/>
  <text x="1000" y="408" class="label">após o sucesso</text>

  <rect x="776" y="430" width="392" height="210" rx="18" fill="#fff" stroke="#e3e8ef"/>
  <text x="796" y="458" class="lane">OPERAÇÃO E ENTREGA</text>
  <rect class="box" x="810" y="500" width="150" height="82" rx="12" fill="#f2f4f7" stroke="#475467"/>
  <rect class="box" x="988" y="500" width="145" height="82" rx="12" fill="#fff4e8" stroke="#f79009"/>
  <text x="885" y="530" text-anchor="middle" class="h">CloudWatch</text><text x="885" y="551" text-anchor="middle" class="p">logs · métricas · alarmes</text>
  <text x="1060" y="530" text-anchor="middle" class="h">GitHub Actions</text><text x="1060" y="551" text-anchor="middle" class="p">testes + Terraform</text>

  <text x="42" y="672" class="subtitle">Terraform provisiona todos os recursos · IAM com papéis separados · SQS e DynamoDB criptografados · credenciais fora do repositório</text>
</svg>
