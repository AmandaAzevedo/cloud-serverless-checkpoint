<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 470" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <rect x="0" y="0" width="1020" height="470" fill="#ffffff"/>

  <text x="20" y="26" fill="#232f3e" font-size="16" font-weight="bold">Checkpoint 3 — Orquestração (1 Lambda + Step Functions nativo)</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#5a6b7b"/>
    </marker>
    <marker id="arrowred" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#d13212"/>
    </marker>
    <marker id="arrowpink" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#c7317a"/>
    </marker>
    <marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#1b9e77"/>
    </marker>
  </defs>

  <g transform="translate(0,36)">
  <!-- Usuário -->
  <rect x="16" y="160" width="100" height="58" rx="8" fill="#eceff1" stroke="#607d8b" stroke-width="2"/>
  <text x="66" y="186" text-anchor="middle" fill="#232f3e" font-weight="bold">Usuário</text>
  <text x="66" y="203" text-anchor="middle" fill="#607d8b" font-size="10">(curl)</text>

  <!-- Lambda -->
  <rect x="140" y="155" width="145" height="70" rx="8" fill="#fff2e6" stroke="#ed7100" stroke-width="2"/>
  <text x="212" y="178" text-anchor="middle" fill="#232f3e" font-weight="bold">Lambda (única)</text>
  <text x="212" y="195" text-anchor="middle" fill="#a35400" font-size="10">POST /v1/selecionar</text>
  <text x="212" y="210" text-anchor="middle" fill="#a35400" font-size="10">GET /v1/alunos</text>

  <!-- Step Functions box -->
  <rect x="310" y="16" width="700" height="250" rx="10" fill="#f3ecfb" stroke="#8c4fdf" stroke-width="2"/>
  <text x="324" y="36" fill="#5b2a9e" font-weight="bold" font-size="12">Step Functions — Map (lote) por aluno (nativo, sem Lambda)</text>

  <rect x="324" y="50" width="104" height="44" rx="8" fill="#f3ecfb" stroke="#8c4fdf" stroke-width="2"/>
  <text x="376" y="68" text-anchor="middle" fill="#232f3e" font-weight="bold" font-size="11">Sortear</text>
  <text x="376" y="83" text-anchor="middle" fill="#5b2a9e" font-size="9">MathRandom</text>

  <rect x="442" y="50" width="104" height="44" rx="8" fill="#f3ecfb" stroke="#8c4fdf" stroke-width="2"/>
  <text x="494" y="68" text-anchor="middle" fill="#232f3e" font-weight="bold" font-size="11">Choice</text>
  <text x="494" y="83" text-anchor="middle" fill="#5b2a9e" font-size="9">lema por casa</text>

  <rect x="560" y="50" width="140" height="44" rx="8" fill="#e8eaf6" stroke="#2e27ad" stroke-width="2"/>
  <text x="630" y="68" text-anchor="middle" fill="#232f3e" font-weight="bold" font-size="11">Persistir</text>
  <text x="630" y="83" text-anchor="middle" fill="#2e27ad" font-size="9">e-mail único</text>

  <rect x="714" y="50" width="118" height="44" rx="8" fill="#fce8ef" stroke="#c7317a" stroke-width="2"/>
  <text x="773" y="68" text-anchor="middle" fill="#232f3e" font-weight="bold" font-size="11">Notificar</text>
  <text x="773" y="83" text-anchor="middle" fill="#a3245e" font-size="9">SES sendEmail</text>

  <rect x="846" y="50" width="150" height="44" rx="8" fill="#e6f4ea" stroke="#1b9e77" stroke-width="2"/>
  <text x="921" y="68" text-anchor="middle" fill="#232f3e" font-weight="bold" font-size="11">MarcarNotificado</text>
  <text x="921" y="83" text-anchor="middle" fill="#127a5c" font-size="9">updateItem: true</text>

  <path d="M428,72 L438,72" fill="none" stroke="#5a6b7b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M546,72 L556,72" fill="none" stroke="#5a6b7b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M700,72 L710,72" fill="none" stroke="#5a6b7b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M832,72 L842,72" fill="none" stroke="#1b9e77" stroke-width="2" marker-end="url(#arrowgreen)"/>
  <text x="838" y="44" text-anchor="middle" fill="#127a5c" font-size="9">ok</text>

  <!-- duplicado -->
  <rect x="560" y="150" width="140" height="40" rx="8" fill="#eef1f4" stroke="#607d8b" stroke-width="2"/>
  <text x="630" y="167" text-anchor="middle" fill="#232f3e" font-size="10" font-weight="bold">e-mail repetido</text>
  <text x="630" y="181" text-anchor="middle" fill="#607d8b" font-size="9">→ "duplicado"</text>
  <path d="M600,94 L615,146" fill="none" stroke="#607d8b" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- rollback -->
  <rect x="714" y="150" width="150" height="46" rx="8" fill="#fdeceb" stroke="#d13212" stroke-width="2"/>
  <text x="789" y="168" text-anchor="middle" fill="#232f3e" font-size="10" font-weight="bold">DesfazerCadastro</text>
  <text x="789" y="182" text-anchor="middle" fill="#a12a0e" font-size="9">rollback: deleteItem</text>
  <path d="M773,94 L780,146" fill="none" stroke="#d13212" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowred)"/>
  <text x="792" y="120" fill="#a12a0e" font-size="9">falha (retry 2x)</text>

  <!-- DynamoDB -->
  <rect x="540" y="320" width="150" height="54" rx="8" fill="#e8eaf6" stroke="#2e27ad" stroke-width="2"/>
  <text x="615" y="343" text-anchor="middle" fill="#232f3e" font-weight="bold">DynamoDB</text>
  <text x="615" y="360" text-anchor="middle" fill="#2e27ad" font-size="9">chave = email · notificado</text>

  <!-- SES -->
  <rect x="720" y="320" width="120" height="54" rx="8" fill="#fce8ef" stroke="#c7317a" stroke-width="2"/>
  <text x="780" y="343" text-anchor="middle" fill="#232f3e" font-weight="bold">Amazon SES</text>
  <text x="780" y="360" text-anchor="middle" fill="#a3245e" font-size="9">e-mail ao aluno</text>

  <!-- DLQ -->
  <rect x="866" y="320" width="130" height="54" rx="8" fill="#fdeceb" stroke="#d13212" stroke-width="2"/>
  <text x="931" y="343" text-anchor="middle" fill="#232f3e" font-weight="bold">SQS DLQ</text>
  <text x="931" y="360" text-anchor="middle" fill="#a12a0e" font-size="9">falhas de e-mail</text>

  <!-- arestas externas -->
  <path d="M116,189 L136,189" fill="none" stroke="#5a6b7b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M285,175 L322,84" fill="none" stroke="#5a6b7b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="286" y="110" fill="#37474f" font-size="10">POST: inicia</text>

  <path d="M615,94 L615,316" fill="none" stroke="#5a6b7b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="621" y="270" fill="#37474f" font-size="10">grava</text>

  <path d="M773,94 L783,316" fill="none" stroke="#c7317a" stroke-width="2" marker-end="url(#arrowpink)"/>
  <text x="785" y="250" fill="#a3245e" font-size="10">envia</text>

  <path d="M789,196 L905,316" fill="none" stroke="#d13212" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowred)"/>
  <text x="838" y="260" fill="#a12a0e" font-size="9">catch → DLQ</text>

  <path d="M235,225 L540,344" fill="none" stroke="#5a6b7b" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="300" y="350" fill="#37474f" font-size="10">GET: lê alunos</text>
  </g>
</svg>
