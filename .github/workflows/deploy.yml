name: CI/CD — Deploy Serverless

# Deploy automático: a cada push na main que altere o código, o fluxo ou a
# infraestrutura, roda os testes e, se passarem, aplica o Terraform na AWS.
# Também pode ser disparado manualmente (workflow_dispatch).
on:
  push:
    branches: [main]
    paths:
      - "lambda_function.py"
      - "statemachine.asl.json"
      - "terraform/**"
      - ".github/workflows/**"
      - "test_lambda_function.py"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: serverless-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  # ---------------------------------------------------------------------------
  # 1) TESTES — barram o deploy se algum falhar.
  # ---------------------------------------------------------------------------
  test:
    name: Testes unitários
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rodar testes
        run: python -m unittest -v

      - name: Validar JSON da state machine
        run: python -m json.tool statemachine.asl.json >/dev/null

  validate:
    name: Validar Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Conferir formatação
        run: terraform fmt -check -recursive

      - name: Inicializar providers sem backend
        working-directory: terraform
        run: terraform init -backend=false -input=false

      - name: Validar configuração
        working-directory: terraform
        run: terraform validate

  # ---------------------------------------------------------------------------
  # 2) DEPLOY — só roda se os testes passarem.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy (Terraform)
    needs: [test, validate]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      TF_VAR_sender_email: ${{ secrets.SENDER_EMAIL }}
      TF_VAR_app_version: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar credenciais AWS (via Secrets)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3

      # O backend.tf não é versionado (contém o nome do bucket com o Account ID);
      # ele é gerado aqui a partir do Secret TF_STATE_BUCKET.
      - name: Gerar backend.tf (a partir do Secret do bucket)
        working-directory: terraform
        run: |
          cat > backend.tf <<EOF
          terraform {
            backend "s3" {
              bucket       = "${{ secrets.TF_STATE_BUCKET }}"
              key          = "cp3/terraform.tfstate"
              region       = "${AWS_REGION}"
              encrypt      = true
              use_lockfile = true
            }
          }
          EOF

      - name: Terraform init
        working-directory: terraform
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform apply
        working-directory: terraform
        run: terraform apply -auto-approve -input=false -lock-timeout=5m

      - name: Resumo do deploy
        run: |
          {
            echo "### Deploy concluído :rocket:"
            echo ""
            echo "- **Commit implantado:** \`${{ github.sha }}\`"
            echo "- **Região:** ${AWS_REGION}"
            echo "- Testes e validação do Terraform concluídos antes do deploy."
            echo "- URLs omitidas intencionalmente dos logs públicos; consulte os outputs em ambiente autenticado."
          } >> "$GITHUB_STEP_SUMMARY"
